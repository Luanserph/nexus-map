name: Build & Release Windows (Tauri v2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar Tauri e subir para Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nexus Maps v__VERSION__'
          releaseBody: 'Instalador Windows gerado automaticamente para a versão v__VERSION__.'
          releaseDraft: true
          prerelease: false
